; ╭──────────────────────────────────────────────────────────────╮
; │  CAVA — спектр для кругового еквалайзера на робочому столі   │
; │  cava лише РАХУЄ висоти стовпців і віддає їх двійковими      │
; │  числами; малює коло ~/.local/bin/visualizer (код і          │
; │  налаштування: ~/.config/hypr/visualizer/visualizer.c).      │
; │  Тиша 3 с → cava засинає (0 навантаження).                   │
; ╰──────────────────────────────────────────────────────────────╯

[general]
framerate = 24          ; кадрів за секунду (більше — плавніше, але більше навантаження; 24 — плавно й економно)
autosens = 1            ; сам підбирає висоту під гучність
bars = 120              ; кількість стовпців по колу
sleep_timer = 3         ; секунд тиші → зупинитись

[input]
method = pipewire       ; слухає все, що грає в системі (kew, mpv, браузер…)
source = auto

[output]
method = raw            ; числа замість малювання
raw_target = /dev/stdout
data_format = binary    ; двійково: не треба розбирати текст
bit_format = 16bit      ; висота стовпця: 0…65535
channels = mono         ; без дзеркала: частоти йдуть по колу від басів до високих
mono_option = average

[smoothing]
monstercat = 0          ; без «пагорбів» — кожен стовпець свій
noise_reduction = 70    ; більше — плавніше, менше — різкіше
