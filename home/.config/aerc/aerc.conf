# ╭──────────────────────────────────────────────────────────────╮
# │  AERC — пошта в правій панелі «Зв'язок» (SUPER+M → Пошта)    │
# │  Скриньки: accounts.conf (створює comms-mail-setup)          │
# │  Решта налаштувань — стандартні з /usr/share/aerc/aerc.conf  │
# ╰──────────────────────────────────────────────────────────────╯

[ui]
# Кольори поточної теми (stylesets/theme → ~/.config/theme/gen/aerc.styleset; змінюються з темою)
styleset-name = theme
# Ширина списку папок (панель вузька — 760 px)
sidebar-width = 16
# Колонки списку листів: дата, від кого, позначки, тема
index-columns = date<9,name<16,flags>3,subject<*
column-date = {{.DateAutoFormat .Date.Local}}
# Дати: дд.мм.рр; сьогоднішні — лише час
timestamp-format = 02.01.06
this-day-time-format = 15:04
this-week-time-format = Mon 15:04
this-year-time-format = 02 Jan
# Клік і прокрутка мишкою
mouse-enabled = true
# Без звукового сигналу терміналу
new-message-bell = false
fuzzy-complete = true
# Список листів зверху (14 рядків), вибраний лист — одразу під ним у тому ж вікні.
# Enter відкриває лист на всю висоту (у вкладці), q — назад.
message-list-split = horizontal 14
# Лист, переглянутий у нижній частині 2 с, стає прочитаним
auto-mark-read-split = true
auto-mark-read-split-delay = 2s

[viewer]
# Чим гортати текст листа: less (пошук «/», прокрутка мишкою), -R — кольори
pager = less -Rc
# Спершу простий текст листа, якщо він є
alternatives = text/plain,text/html
header-layout = From,To,Cc,Date,Subject

[compose]
# Попередити, якщо тема порожня або згадано вкладення, а файлу немає
empty-subject-warning = true
no-attachment-warning = ^[^>]*(вкладен|додаю|attach)

[statusline]
display-mode = icon

[filters]
# Як показувати різні частини листа — усе текстом, прямо в aerc, без браузера.
# HTML: через w3m (таблиці, посилання). Запасний перетворювач без w3m:
#   text/html = python3 ~/.config/aerc/filters/html2text.py
text/plain = colorize
text/calendar = calendar
message/delivery-status = colorize
message/rfc822 = colorize
text/html = html
.headers = colorize
