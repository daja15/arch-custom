; ╭──────────────────────────────────────────────────────────────╮
; │  ENDCORD — Discord у терміналі (права панель «Зв'язок»)       │
; │  Повний список параметрів: /usr/share/doc/endcord/            │
; │  Кольори — з теми системи (~/.config/theme, змінюються разом  │
; │  з нею; endcord підхоплює їх після перезапуску).              │
; ╰──────────────────────────────────────────────────────────────╯
[main]
; тема: згенерована з ~/.config/theme/templates/endcord.ini
theme = "/home/jijau/.config/theme/gen/endcord.ini"
; сповіщення на робочому столі, коли тебе згадали; звук грає віджет сповіщень, тож свій вимкнено
desktop_notifications = True
linux_notification_sound = None
; редактор для довгих повідомлень
external_editor = "micro"
; смугу прокрутки чату вимкнено: в endcord 1.6.0 через неї програма вилітає, щойно відкриваєш чат
; (UnboundLocalError: thumb_pos у draw_scrollbar_chat). Коли вийде виправлення — можна повернути True
draw_scrollbar = False
; фото, гіфки, відео й голосові (Ctrl+W або v на вкладенні) — у VLC поруч з чатом,
; так само як у Telegram: той самий скрипт, VLC стає в праву панель (hypr/comms.lua).
; endcord спершу сам завантажує вкладення, тож скрипт отримує локальний файл.
custom_media_player = "~/.config/nchat/open-media.sh"
