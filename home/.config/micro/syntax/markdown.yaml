    - special.codebody:
        start: "^\\s*```(ruby|rb)\\s*$"
        end: "^\\s*```\\s*$"
        rules:
            - include: "ruby"
            - symbol.fence: "^\\s*```.*$"      # рамка ``` — приглушена (останнє правило = пріоритет)
    - special.codebody:
        start: "^\\s*```(php)\\s*$"
        end: "^\\s*```\\s*$"
        rules:
            - include: "php"
            - symbol.fence: "^\\s*```.*$"      # рамка ``` — приглушена (останнє правило = пріоритет)
    - special.codebody:
        start: "^\\s*```(make|makefile)\\s*$"
        end: "^\\s*```\\s*$"
        rules:
