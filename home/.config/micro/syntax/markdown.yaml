    - special.codebody:
        start: "^\\s*```(go|golang)\\s*$"
        end: "^\\s*```\\s*$"
        rules:
            - include: "go"
            - symbol.fence: "^\\s*```.*$"      # рамка ``` — приглушена (останнє правило = пріоритет)
    - special.codebody:
