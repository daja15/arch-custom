# ╭──────────────────────────────────────────────────────────────╮
# │  MICRO — підсвічування Markdown (замість вбудованого)        │
# │  Кольори — у colorschemes/tykha-nich.micro (групи *.md*).    │
# │  У блоках ```мова … ``` підсвічується сама мова.             │
# │  Пізніші правила мають пріоритет над ранішими.               │
# ╰──────────────────────────────────────────────────────────────╯
filetype: markdown

detect:
    filename: "\\.(livemd|md|mkd|mkdn|markdown)$"

rules:
    # Таблиці: лише роздільники | і рядок-лінійка
    - symbol.table: "\\|"
    - symbol.table: "^\\s*\\|?\\s*:?-{3,}:?\\s*(\\|\\s*:?-{3,}:?\\s*)*\\|?\\s*$"
    # Цитати
    - statement.quote: "^\\s*>.*"
    # Курсив, жирний, жирний курсив, закреслений
    - type.italic: "(^|[^*_\\w])(\\*[^*\\s][^*]*\\*|_[^_\\s][^_]*_)"
    - type.bold: "(\\*\\*[^*\\s][^*]*\\*\\*|__[^_\\s][^_]*__)"
    - type.bolditalic: "(\\*\\*\\*[^*\\s][^*]*\\*\\*\\*)"
    - type.strike: "~~[^~\\s][^~]*~~"
    # Горизонтальна лінія
    - symbol.hr: "^\\s*(---+|\\*\\*\\*+|___+)\\s*$"
    # Списки: маркер і номер
    - identifier.list: "^\\s*([*+-]|[0-9]+[.)])\\s"
    # Чекбокси
    - identifier.todo: "^\\s*[*+-]\\s\\[ \\]"
    - identifier.done: "^\\s*[*+-]\\s\\[[xX]\\].*"
    # Посилання: [текст](адреса), картинки, голі URL, <адреси>
    - constant.linktext: "\\[[^]]+\\]"
    - underlined.url: "\\]\\([^)]+\\)"
    - underlined.url: "https?://[^ )>]+"
    - underlined.url: "<[a-z]+://[^>]+>"
    - constant.image: "!\\[[^]]*\\]"
    # Заголовки (рівні 1, 2, 3–6) і підкреслені заголовки
    - special.h3: "^\\s*#{3,6}\\s.*"
    - special.h2: "^\\s*##\\s.*"
    - special.h1: "^\\s*#\\s.*"
    - special.h1: "^===+\\s*$"
    - special.h2: "^---+\\s*$"
    # Коментарі HTML
    - comment:
        start: "<!--"
        end: "-->"
        rules: []
    # Блоки коду з мовою (```python тощо) — підсвічується сама мова.
    # Без limit-group: у micro 2.0.15 він вимикає правила всередині блоку.
    - special.codebody:
        start: "^\\s*```(py|python|python3)\\s*$"
        end: "^\\s*```\\s*$"
        rules:
            - include: "python"
            - symbol.fence: "^\\s*```.*$"      # рамка ``` — приглушена (останнє правило = пріоритет)
    - special.codebody:
        start: "^\\s*```(sh|bash|zsh|shell|console|shellsession)\\s*$"
        end: "^\\s*```\\s*$"
        rules:
            - include: "shell"
            - symbol.fence: "^\\s*```.*$"      # рамка ``` — приглушена (останнє правило = пріоритет)
    - special.codebody:
        start: "^\\s*```(json|jsonc|json5)\\s*$"
        end: "^\\s*```\\s*$"
        rules:
            - include: "json"
            - symbol.fence: "^\\s*```.*$"      # рамка ``` — приглушена (останнє правило = пріоритет)
    - special.codebody:
        start: "^\\s*```(ya?ml)\\s*$"
        end: "^\\s*```\\s*$"
        rules:
            - include: "yaml"
            - symbol.fence: "^\\s*```.*$"      # рамка ``` — приглушена (останнє правило = пріоритет)
    - special.codebody:
        start: "^\\s*```(lua)\\s*$"
        end: "^\\s*```\\s*$"
        rules:
            - include: "lua"
            - symbol.fence: "^\\s*```.*$"      # рамка ``` — приглушена (останнє правило = пріоритет)
    - special.codebody:
        start: "^\\s*```(toml)\\s*$"
        end: "^\\s*```\\s*$"
        rules:
            - include: "toml"
            - symbol.fence: "^\\s*```.*$"      # рамка ``` — приглушена (останнє правило = пріоритет)
    - special.codebody:
        start: "^\\s*```(js|javascript|mjs|cjs|jsx)\\s*$"
        end: "^\\s*```\\s*$"
