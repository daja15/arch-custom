    # Блок коду без мови / невідома мова
    - special.codeblock:
        start: "^\\s*```.*$"
        end: "^\\s*```\\s*$"
        rules:
            - symbol.fence: "^\\s*```.*$"      # рамка ``` — приглушена (останнє правило = пріоритет)

    # Код у рядку: `...`
    - special.code:
        start: "`"
        end: "`"
        rules: []
