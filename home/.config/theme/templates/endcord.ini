; Тема для endcord (Discord у терміналі) — ШАБЛОН: {назва} → колір з ~/.config/theme/theme.conf
; Результат: ~/.config/theme/gen/endcord.ini (на нього вказує theme у ~/.config/endcord/config.ini)
; Колір = [текст, фон, атрибут]; -1 — колір терміналу, -2 — як у базового кольору рядка.
; Атрибути: "b" жирний, "i" курсив, "u" підкреслений. Endcord читає тему лише при старті.
[theme]
; ───── Загальні
color_default = [-1, -1]
color_green = ["{green}", -1]
color_orange = ["{yellow}", -1]
color_red = ["{red}", -1]
; ───── Чат
color_chat_mention = [-2, "{accent-bg}"]
color_chat_blocked = ["{dim}", -1]
color_chat_deleted = ["{red-soft}", -1]
color_chat_pending = ["{dim}", -1]
color_chat_selected = ["{bright}", "{overlay}"]
color_chat_separator = ["{dim}", -1, "i"]
color_chat_standout = ["{accent}", "{surface}"]
color_chat_edited = ["{dim}", -1]
color_chat_url = ["{accent}", -1, "u"]
color_chat_spoiler = ["{line}", "{line}"]
color_chat_code = ["{text}", "{surface}"]
; ───── Рядки стану, заголовка, підказки, вводу
color_status_line = ["{muted}", "{surface}"]
color_extra_line = ["{text}", "{overlay}"]
color_title_line = ["{accent}", "{surface}", "b"]
color_subtitle_line = ["{dim}", -1]
color_extra_window = [-1, -1]
color_extra_window_low = ["{muted}", -1]
color_extra_window_standout = ["{accent}", -1]
color_prompt = ["{accent2}", -1]
color_input_line = ["{text}", -1]
color_cursor = ["{bg}", "{accent}"]
color_scrollbar = ["{line}", -1]
color_misspelled = ["{yellow}", -1, "u"]
; ───── Дерево серверів і каналів
color_tree_default = ["{text}", -1]
color_tree_category = ["{accent2}", -1]
color_tree_server = ["{accent}", -1]
color_tree_selected = ["{bright}", "{overlay}"]
color_tree_muted = ["{dim}", -1]
color_tree_active = ["{accent}", "{accent-bg}"]
color_tree_unseen = [-2, -2, "b"]
color_tree_mentioned = ["{red}", -1]
color_tree_active_mentioned = ["{red}", "{accent-bg}"]
color_tree_selected_mentioned = ["{red}", "{overlay}"]
; ───── Повідомлення: [базовий, [колір, фон, атрибут, від, до], …] — час сірий, «<» «>» навколо імені акцентні
color_format_message = [[-1, -1], ["{dim}", -2, 0, 0, 7], ["{accent}", -2, 0, 8, 9], ["{accent}", -2, 0, 19, 20]]
color_format_message_grouped = [[-1, -1], ["{dim}", -2, 0, 1, 2]]
color_format_newline = [[-1, -1], ["{dim}", -2, 0, 1, 2]]
color_format_reply = [["{muted}", -1], ["{dim}", -2, 0, 1, 5], ["{accent}", -2, 0, 14, 15], ["{accent}", -2, 0, 25, 26]]
color_format_reactions = [["{muted}", -1], ["{dim}", -2, 0, 1, 5]]
color_format_interaction = [["{muted}", -1], ["{dim}", -2, 0, 1, 5]]
color_format_forum = [[-1, -1], ["{dim}", -2, 0, 0, 12], ["{accent}", -2, 0, 15, 20]]
; ───── Час українською (24 год)
format_timestamp = "%H:%M"
format_date = " %d.%m.%Y "
edited_string = "(змінено)"
