# ╭──────────────────────────────────────────────────────────────╮
# │  HYPRLOCK — екран блокування, тема «Тиха ніч»                │
# │  Шаблон: {назва} → значення з ~/.config/theme/theme.conf.    │
# │  Готовий файл: ~/.config/theme/gen/hyprlock.conf (його        │
# │  підключає ~/.config/hypr/hyprlock.conf).                    │
# │                                                              │
# │  Вигляд як у порожнього робочого столу: суцільний фон,       │
# │  великий годинник, дата, поле пароля-«острівець».            │
# │  Без знімка екрана й розмиття — блокування миттєве й         │
# │  не вантажить відеокарту.                                    │
# │                                                              │
# │  SUPER+L — заблокувати · Esc / Ctrl+U — стерти пароль        │
# ╰──────────────────────────────────────────────────────────────╯

general {
    hide_cursor        = true    # курсор не потрібен — лише пароль
    ignore_empty_input = true    # Enter у порожньому полі нічого не робить
}

# Коротка поява / зникнення (0,2 с), без зайвого
animations {
    enabled   = true
    bezier    = linear, 1, 1, 0, 0
    animation = fadeIn,  1, 2, linear
    animation = fadeOut, 1, 2, linear
    animation = inputFieldDots, 1, 2, linear
}

# Фон — суцільний колір теми (як порожній стіл)
background {
    monitor =
    color   = rgb({bg:hex})
}

# ───────────── ГОДИННИК ─────────────
label {
    monitor     =
    text        = $TIME                       # ГГ:ХХ
    color       = rgb({text:hex})
    font_size   = 110
    font_family = {mono}
    position    = 0, 150
    halign      = center
    valign      = center
}

# ───────────── ДАТА ─────────────
# «Неділя, 15 листопада» — з великої літери, оновлюється щохвилини
label {
    monitor     =
    text        = cmd[update:60000] date +"%A, %-d %B" | sed 's/^./\U&/'
    color       = rgb({accent2:hex})
    font_size   = 18
    font_family = {ui}
    position    = 0, 50
    halign      = center
    valign      = center
}

# ───────────── ПОЛЕ ПАРОЛЯ — «острівець» ─────────────
input-field {
    monitor           =
    size              = 340, 52
    outline_thickness = {border}
    rounding          = {radius}
    outer_color       = rgb({line:hex})       # рамка
    inner_color       = rgb({surface:hex})    # фон поля
    font_color        = rgb({text:hex})       # крапки пароля
    check_color       = rgb({accent:hex})     # перевірка пароля — рамка блакитна
    fail_color        = rgb({red:hex})        # неправильний пароль — червона
    capslock_color    = rgb({yellow:hex})     # увімкнено Caps Lock — жовта
    font_family       = {ui}
    placeholder_text  = <span foreground="##{muted:hex}">Пароль</span>                 # «##» — це одна «#» (інакше — коментар)
    fail_text         = <span foreground="##{red-soft:hex}">Неправильний пароль</span>
    fade_on_empty     = false
    dots_size         = 0.25
    dots_spacing      = 0.35
    dots_center       = true
    position          = 0, -60
    halign            = center
    valign            = center
}

# ───────────── РОЗКЛАДКА ─────────────
label {
    monitor     =
    text        = $LAYOUT[EN,UA]
    color       = rgb({muted:hex})
    font_size   = 11
    font_family = {ui}
    position    = 0, -120
    halign      = center
    valign      = center
}
