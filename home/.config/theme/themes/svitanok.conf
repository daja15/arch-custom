# ╭──────────────────────────────────────────────────────────────╮
# │  ТЕМА «Світанок» (світла) — кольори, шрифти, форма         │
# │                                                              │
# │  Теми лежать у ~/.config/theme/themes/*.conf, активна —      │
# │  ~/.config/theme/theme.conf (посилання на одну з них).       │
# │  Перемкнути тему: SUPER+Shift+T або команда  theme           │
# │                                                              │
# │  Звідси беруть вигляд УСІ програми: Hyprland, waybar (усі    │
# │  три), rofi, сповіщення, плашка гучності, kitty, віджети     │
# │  робочого столу, еквалайзер, знімки екрана, панелі, пошта,   │
# │  Telegram (nchat — після перезапуску), micro, екран блокування│
# │                                                              │
# │  Змінив щось → виконай:   ~/.config/theme/apply              │
# │  Файли в gen/ — згенеровані, їх НЕ редагувати.               │
# │                                                              │
# │  Формат: назва = значення   # коментар                       │
# ╰──────────────────────────────────────────────────────────────╯

[meta]
name      = Світанок      # назва в меню тем
mode      = light         # dark / light — підказка програмам GTK/Firefox (див. gtk нижче)
gtk       = light         # default — не чіпати; dark / light — темні / світлі вікна програм (Firefox, GTK)
wallpaper = ~/Pictures/Wallpapers/Світанок.jpg   # шпалери теми (порожньо — не міняти)

[colors]
# Світла тема: «фони» — від найсвітлішого (папір) до темніших; «текст» — від блідого до найтемнішого.
# Назви ролей ті самі, що в темній темі, щоб усі програми брали правильні кольори.
# ───── Фони (від найсвітлішого)
bg          = #f5f2ec   # фон вікон, панелей, терміналу (теплий папір)
surface     = #ebe7df   # фон «острівців» waybar, неактивні вкладки
hover       = #e4dfd5   # наведення в сповіщеннях
overlay     = #ddd7cc   # наведення, «пігулки», тональні кнопки
line        = #cbc4b6   # рамки, лінії, виділення тексту
faint       = #b4ac9e   # між line і dim: номери рядків, лінії таблиць (micro)
# ───── Текст
dim         = #9a9286   # дуже приглушений: минулі дні, коментарі в коді
muted       = #6f685e   # приглушений: підписи, неактивне
text        = #2f2c28   # основний текст
bright      = #1a1815   # найконтрастніший (у світлій темі — найтемніший)
# ───── Акценти
accent      = #2a7489   # головний (глибокий бірюзовий): активне, курсор, «сьогодні»
accent-soft = #1c5869   # темніший головний (іконка на тлі акценту)
accent-bg   = #d4e5e8   # головний, змішаний з фоном (тло кнопки «увімкнено»)
accent2     = #7353b5   # другий (фіолетовий): заголовки, виконавець, секунда
blue        = #3b68a0
green       = #557f32
yellow      = #a0700f
red         = #c03e4b   # тривога, запис, вихідні
red-soft    = #b8505b   # числа вихідних
red-text    = #8a2430   # текст на червоному тлі
red-bg      = #f4dadb   # червоний, змішаний з фоном (критичні сповіщення)

[terminal]
# 16 кольорів терміналу (kitty): звичайний / яскравий (у світлій темі «яскраві» — трохи світліші)
black   = #2f2c28 #6f685e
red     = #c03e4b #cf5a66
green   = #557f32 #679340
yellow  = #a0700f #b5841f
blue    = #3b68a0 #517fb6
magenta = #7353b5 #8768c6
cyan    = #2a7489 #3f8ba0
white   = #cbc4b6 #ebe7df

[fonts]
ui      = JetBrainsMono Fast          # основний: «bionic» (жирніший початок слова) + лігатури
icons   = JetBrainsMono Nerd Font     # запасний: іконки Nerd Font
mono    = JetBrainsMono Nerd Font Mono   # строго моноширинний: цифри годинника, календар
size    = 11                          # основний розмір (pt)

[type]
# Шрифти інтерфейсу — однакові всюди: віджети столу, waybar (усі три), rofi, сповіщення,
# панелі «Музика» й «Зв'язок». Розміри — у пунктах (pt). Основа — віджети робочого столу.
display  = 22   # великі числа: температура в погоді
title    = 12   # заголовок картки / меню (жирний, другий акцент)
subtitle = 9    # підзаголовок, назва розділу (напівжирний, приглушений)
body     = 10   # основний текст, пункти меню, кнопки панелі
caption  = 8    # дрібні підписи: час, порти, «2 дні тому»
icon     = 12   # іконки-кнопки (панель «Музика», меню)
bold     = 700  # жирний: заголовки, назви
medium   = 600  # напівжирний: підзаголовки, кнопки, waybar

[shape]
radius      = 10    # заокруглення: вікна, острівці waybar, меню, кнопки
radius-card = 16    # заокруглення карток робочого столу (календар, музика)
border      = 2     # товщина рамки вікна
gaps-in     = 4     # відступ між вікнами
gaps-out    = 8     # відступ від вікон до країв екрана
gaps-top    = 22    # … зверху — більший (місце для вкладок груп і waybar)
radius-control = 8   # заокруглення кнопок, рядків списків, полів вводу
pad-y       = 16    # внутрішній відступ карток і меню: згори / знизу (сітка 4 px: 4·8·12·16·24)
pad-x       = 16    # … зліва / справа
gap         = 8     # відступ між рядками й кнопками всередині
card-alpha  = 0.72  # непрозорість фону карток столу (1 — суцільний)
