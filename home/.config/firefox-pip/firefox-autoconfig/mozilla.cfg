// ПЕРШИЙ РЯДОК — завжди коментар (Firefox його пропускає).
// ╭──────────────────────────────────────────────────────────────╮
// │  mozilla.cfg — дозволити непідписані плагіни у Firefox       │
// │  Звичайний Firefox ставить лише плагіни, підписані Mozilla.  │
// │  Тут перевірку підпису вимкнено: Firefox питає               │
// │  XPIDatabase.mustSign(тип) — відповідаємо «ні».              │
// │  УВАГА: так можна поставити будь-який непідписаний плагін —  │
// │  став лише ті, яким довіряєш.                                │
// │  Ставиться в /usr/lib/firefox/ (потрібен sudo). Прибрати —   │
// │  видалити цей файл і defaults/pref/autoconfig.js.            │
// │  Після великих оновлень Firefox може змінити цю перевірку —  │
// │  тоді плагін вимкнеться (Firefox нічого не зламає).          │
// ╰──────────────────────────────────────────────────────────────╯
try {
  const { XPIDatabase } = ChromeUtils.importESModule("resource://gre/modules/addons/XPIDatabase.sys.mjs");
  XPIDatabase.mustSign = () => false;
} catch (e) {
  Components.utils.reportError("mozilla.cfg: не вдалося вимкнути перевірку підпису: " + e);
}
// Плагіни, покладені прямо в теку профілю (extensions/*.xpi), вмикати одразу, без запитання
defaultPref("extensions.autoDisableScopes", 14);
