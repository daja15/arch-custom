# Шрифти й кольори — з теми ~/.config/theme/theme.conf (згенеровано в gen/kitty.conf):
# «JetBrainsMono Fast» — початок слова жирніший, лігатури коду й іконки Nerd Font збережено;
# жирний і курсив — звичайний JetBrains Mono. Тему перемикає ~/.config/theme/theme.
# (Файлів *-theme.auto.conf тут НЕМАЄ навмисно: kitty читає їх лише при старті й
# перекриває ними тему — тоді перемикання тем не змінює кольорів терміналу.)
include ../theme/gen/kitty.conf

# ───── Плавна прокрутка тачпадом (у самому терміналі: історія, вивід команд)
# (kitty не дозволяє коментарі в одному рядку з параметром — лише окремими рядками)
# попіксельно, а не стрибками по рядку
pixel_scroll            yes
# крок прокрутки тачпадом: система вже прискорює прокрутку ×2 (hyprland.lua TP_SCROLL), тут — м'якше
touch_scroll_multiplier 0.55
# інерція після того, як прибрав пальці: 0 — немає, ближче до 1 — довше котиться (потрібен перезапуск kitty)
momentum_scroll         0.975
# (перевірено 2026-11-15: repaint_delay 5 / input_delay 1 не дають ні плавності, ні навантаження —
#  kitty однаково малює в такт екрану 60 Гц; тому стандартні 10 / 3)

background_opacity .9
cursor_shape beam
cursor_blink_interval 0.5
inactive_text_alpha .5
dim_opacity 0
background_tint 0

copy_on_select yes

# Закривати вікно одразу, без питання «у вікні ще щось працює — закрити?»
confirm_os_window_close 0

mouse_map right press ungrabbed discard_event
mouse_map right click ungrabbed paste_from_clipboard

map f1 clear_terminal clear active

# Ctrl+Z — не «призупиняти» програму. У вікні Claude Code клавішу просто ігноруємо
# (він сам себе ховав у фон); в інших програмах (micro: Ctrl+Z = відмінити) працює як звичайно.
map --when-focus-on cmdline:claude ctrl+z discard_event

shell /usr/bin/zsh
