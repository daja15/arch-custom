<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  ╭──────────────────────────────────────────────────────────────╮
  │  ШРИФТИ ЗА ЗАМОВЧУВАННЯМ — для всіх програм                  │
  │  «JetBrainsMono Fast»: початок слова жирніший (bionic),      │
  │  лігатури коду та іконки Nerd Font. Чого в ньому немає       │
  │  (китайська, емодзі…) — береться з наступних у списку.      │
  ╰──────────────────────────────────────────────────────────────╯
-->
<fontconfig>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>JetBrainsMono Fast</family>
      <family>Noto Sans</family>
      <family>Noto Sans CJK SC</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>JetBrainsMono Fast</family>
      <family>Noto Serif</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Fast</family>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
