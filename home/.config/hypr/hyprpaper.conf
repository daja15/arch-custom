# ╭──────────────────────────────────────────────────────────────╮
# │  HYPRPAPER — шпалери робочого столу                          │
# │  Картинка: ~/.config/hypr/wallpaper.jpg — її пише програма   │
# │  wallpaper (SUPER+Shift+W), колекція ~/Pictures/Wallpapers   │
# │  Статична картинка — після старту 0 навантаження.            │
# ╰──────────────────────────────────────────────────────────────╯

splash = false               # без напису-заставки поверх шпалер

wallpaper {
    monitor  =                           # порожньо = усі монітори
    path     = ~/.config/hypr/wallpaper.jpg
    fit_mode = cover                     # заповнити екран, зберігаючи пропорції (краї обрізаються)
}
