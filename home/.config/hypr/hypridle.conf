# ╭──────────────────────────────────────────────────────────────╮
# │  HYPRIDLE — що робити, коли ти не користуєшся комп'ютером    │
# │    5 хв  → притемнити екран (рух мишки — повернути)          │
# │   10 хв  → заблокувати (hyprlock)                            │
# │   15 хв  → вимкнути екран                                    │
# │  Перед сном (кришка, suspend) — теж блокування.              │
# │  Запускає hypr/services.sh. Формат — hyprlang (не Lua).      │
# │  Увага: «hyprctl dispatch» у Lua-конфігу не працює —         │
# │  екраном керуємо через hyprctl eval.                         │
# ╰──────────────────────────────────────────────────────────────╯

general {
    lock_cmd = pidof hyprlock || hyprlock                       # блокувати (лише одну копію)
    before_sleep_cmd = loginctl lock-session                    # перед сном — заблокувати
    after_sleep_cmd = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "on" }))'   # після сну — увімкнути екран
    ignore_dbus_inhibit = false                                 # не гасити екран, поки грає відео / музика у браузері
}

# Притемнити екран (стара яскравість запам'ятовується й повертається)
listener {
    timeout = 300
    on-timeout = brightnessctl -s set 15%
    on-resume = brightnessctl -r
}

# Заблокувати
listener {
    timeout = 600
    on-timeout = loginctl lock-session
}

# Вимкнути екран
listener {
    timeout = 900
    on-timeout = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "off" }))'
    on-resume = hyprctl eval 'hl.dispatch(hl.dsp.dpms({ action = "on" }))'
}
